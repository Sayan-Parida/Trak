<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trak</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
    }
    .status-container {
      display: flex;
      align-items: center;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .connected { background-color: #4caf50; }
    .disconnected { background-color: #f44336; }
    
    .section {
      margin-bottom: 16px;
    }
    
    #session-info {
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    #queue-info {
      font-size: 12px;
      color: #ff9800;
      margin-bottom: 8px;
      display: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    .primary-btn {
      background-color: #2196f3;
      color: white;
    }
    
    .danger-btn {
      background-color: #f44336;
      color: white;
    }
    
    .secondary-btn {
      background-color: #e0e0e0;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Trak</h1>
    <div class="status-container">
      <div id="status-indicator" class="status-dot disconnected"></div>
      <span id="status-text">Checking...</span>
    </div>
  </div>

  <div class="section">
    <div id="session-info">Loading...</div>
    <div id="queue-info"></div>
    
    <div id="start-session-div" style="display: none;">
      <input type="text" id="session-title" placeholder="Session Title (optional)">
      <button id="start-btn" class="primary-btn">Start Session</button>
    </div>
    
    <div id="end-session-div" style="display: none;">
      <button id="end-btn" class="danger-btn">End Session</button>
    </div>
  </div>

  <div class="section">
    <button id="dashboard-btn" class="secondary-btn">Open Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
