spring.datasource.url=jdbc:sqlite:./data/trak.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8080

# M5 content / evidence layer (production-quality defaults; conservative capture)
tkr.content.extraction.enabled=true
tkr.content.extraction.auto-on-dwell-seconds=30
tkr.content.extraction.require-manual-confirmation=false
tkr.content.extraction.max-content-length=100000
tkr.content.extraction.prohibited-url-prefixes=chrome://,chrome-extension://,about:,data:,mailto:,file://
tkr.content.chunking.max-chunk-chars=2000
tkr.content.chunking.overlap-chars=200
tkr.content.privacy.exclude-domains=
# Vector store: auto detects datasource (postgresql -> pgvector, else sqlite app-layer for dev/test)
tkr.vector-store.type=auto
# Embedding provider: unset by default -> deterministic mock (tests/local dev).
# Production sets TKR_EMBEDDING_PROVIDER=openai-compatible plus endpoint + api key.
# tkr.embedding.provider=openai-compatible
# tkr.embedding.endpoint and tkr.embedding.api-key come from env in production; unset -> provider unavailable (content still extracted, embedding deferred)
# tkr.embedding.endpoint=
# tkr.embedding.api-key=${EMBEDDING_API_KEY:}
tkr.embedding.model=text-embedding-3-small
tkr.embedding.dimension=1536
tkr.embedding.batch-size=32
tkr.embedding.timeout-seconds=30
tkr.embedding.max-retries=3
